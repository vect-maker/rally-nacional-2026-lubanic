<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 225" width="100%" height="100%">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1E5631"/>
    </marker>
    <marker id="arr-coffee" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3E2712"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#C88A2C"/>
    </marker>
  </defs>

  <!-- Stage 1: Nodos Sensores Industriales (3 stacked modules) -->
  <rect x="6" y="8" width="248" height="209" rx="10" fill="#E8F3EB" stroke="#1E5631" stroke-width="2"/>
  <rect x="16" y="16" width="228" height="23" rx="5" fill="#1E5631"/>
  <text x="130" y="32" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4 NODOS ESP32 DEVKITC (IP67)</text>

  <!-- Sub-box 1A: Fermentacion -->
  <rect x="16" y="45" width="228" height="50" rx="6" fill="#FFFFFF" stroke="#1E5631" stroke-width="1.2"/>
  <text x="26" y="62" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11" font-weight="bold" fill="#1E5631">Pila de Fermentación</text>
  <text x="26" y="77" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#212529">Electrodo pH Líquido Ind. + Amp.</text>
  <text x="26" y="90" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#5A6268">Sonda Temp. Impermeable DS18B20</text>

  <!-- Sub-box 1B: Secado y Peso -->
  <rect x="16" y="101" width="228" height="52" rx="6" fill="#FFFFFF" stroke="#C88A2C" stroke-width="1.2"/>
  <text x="26" y="117" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11" font-weight="bold" fill="#3E2712">Secadora Solar &amp; Báscula</text>
  <text x="26" y="132" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#212529">PT100 (MAX31865) · Termopar K</text>
  <text x="26" y="146" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#5A6268">Humedad SHT31 · Celda 50kg HX711</text>

  <!-- Sub-box 1C: Finca y Bodega -->
  <rect x="16" y="159" width="228" height="50" rx="6" fill="#FFFFFF" stroke="#3E2712" stroke-width="1.2"/>
  <text x="26" y="175" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11" font-weight="bold" fill="#3E2712">Clima, Suelo &amp; Bodega</text>
  <text x="26" y="190" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#212529">Agroclimático BME280 · Bodega DHT22</text>
  <text x="26" y="203" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#5A6268">Sonda pH Terreno · Humedad Suelo</text>

  <!-- Link 1 -> 2 -->
  <line x1="254" y1="112" x2="338" y2="112" stroke="#1E5631" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <rect x="259" y="76" width="74" height="30" rx="4" fill="#FFFFFF" stroke="#1E5631" stroke-width="1"/>
  <text x="296" y="89" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.5" font-weight="bold" fill="#1E5631" text-anchor="middle">BLE / Wi-Fi</text>
  <text x="296" y="101" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="8.5" fill="#212529" text-anchor="middle">Bus RS-485</text>

  <!-- Stage 2: Colector Local -->
  <rect x="342" y="18" width="212" height="106" rx="10" fill="#FDF5E6" stroke="#C88A2C" stroke-width="2"/>
  <rect x="354" y="28" width="188" height="22" rx="5" fill="#C88A2C"/>
  <text x="448" y="43" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COLECTOR LOCAL (HUB)</text>
  <text x="448" y="65" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11" font-weight="bold" fill="#3E2712" text-anchor="middle">Concentrador en Beneficio</text>
  <text x="448" y="83" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#212529" text-anchor="middle">• Memoria Flash no volátil</text>
  <text x="448" y="99" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" fill="#212529" text-anchor="middle">• Aislamiento óptico PC817</text>
  <text x="448" y="115" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10" font-weight="bold" fill="#1E5631" text-anchor="middle">• 2.4 GHz Libre de TELCOR</text>

  <!-- Branch Down: Colector -> Visor Local Productor -->
  <line x1="448" y1="124" x2="448" y2="152" stroke="#3E2712" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-coffee)"/>
  <rect x="342" y="156" width="212" height="58" rx="8" fill="#FFFFFF" stroke="#3E2712" stroke-width="1.8"/>
  <text x="448" y="175" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11" font-weight="bold" fill="#3E2712" text-anchor="middle">Visor Móvil del Productor</text>
  <text x="448" y="191" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.8" fill="#212529" text-anchor="middle">Wi-Fi AP Local (Sin Internet)</text>
  <text x="448" y="205" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.5" font-weight="bold" fill="#1E5631" text-anchor="middle">Semáforo Preventivo pH / Temp</text>

  <!-- Link 2 -> 3 -->
  <line x1="554" y1="71" x2="634" y2="71" stroke="#C88A2C" stroke-width="2.4" marker-end="url(#arr-gold)"/>
  <rect x="559" y="36" width="70" height="28" rx="4" fill="#FDF5E6" stroke="#C88A2C" stroke-width="1"/>
  <text x="594" y="49" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9" font-weight="bold" fill="#3E2712" text-anchor="middle">Store &amp;</text>
  <text x="594" y="60" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9" font-weight="bold" fill="#3E2712" text-anchor="middle">Forward</text>

  <!-- Stage 3: Gateway & Servidor Cloud Azure VM -->
  <rect x="638" y="14" width="234" height="198" rx="10" fill="#F5EBE1" stroke="#3E2712" stroke-width="2"/>
  <rect x="650" y="24" width="210" height="23" rx="5" fill="#3E2712"/>
  <text x="755" y="40" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#F5EBE1" text-anchor="middle">GATEWAY &amp; CLOUD AZURE</text>

  <rect x="650" y="54" width="210" height="62" rx="6" fill="#FFFFFF" stroke="#3E2712" stroke-width="1.2"/>
  <text x="755" y="71" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10.8" font-weight="bold" fill="#3E2712" text-anchor="middle">Gateway de Enlace Asíncrono</text>
  <text x="755" y="87" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.8" fill="#212529" text-anchor="middle">• Despacho por lotes comprimidos</text>
  <text x="755" y="103" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.8" fill="#1E5631" text-anchor="middle">• Tolerante a cortes en montaña</text>

  <rect x="650" y="124" width="210" height="78" rx="6" fill="#FFFFFF" stroke="#1E5631" stroke-width="1.2"/>
  <text x="755" y="141" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10.8" font-weight="bold" fill="#1E5631" text-anchor="middle">Servidor Cloud (Azure VM B2s)</text>
  <text x="755" y="157" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.8" fill="#212529" text-anchor="middle">• Backend Rust (Axum) + Tokio</text>
  <text x="755" y="173" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.8" fill="#212529" text-anchor="middle">• PostgreSQL (Relacional + JSONB)</text>
  <text x="755" y="189" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.8" font-weight="bold" fill="#C88A2C" text-anchor="middle">• Algoritmo Predictivo SCA &amp; Hash</text>

  <!-- Link 3 -> 4 -->
  <line x1="872" y1="112" x2="936" y2="112" stroke="#1E5631" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <rect x="877" y="76" width="54" height="28" rx="4" fill="#E8F3EB" stroke="#1E5631" stroke-width="1"/>
  <text x="904" y="89" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9" font-weight="bold" fill="#1E5631" text-anchor="middle">HTTPS</text>
  <text x="904" y="100" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="8.5" fill="#212529" text-anchor="middle">Vite / QR</text>

  <!-- Stage 4: Clientes de Acceso -->
  <rect x="940" y="14" width="214" height="198" rx="10" fill="#E8F3EB" stroke="#1E5631" stroke-width="2"/>
  <rect x="952" y="24" width="190" height="23" rx="5" fill="#1E5631"/>
  <text x="1047" y="40" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CLIENTES Y MERCADO</text>

  <rect x="952" y="54" width="190" height="44" rx="5" fill="#FFFFFF" stroke="#3E2712" stroke-width="1.1"/>
  <text x="1047" y="72" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#3E2712" text-anchor="middle">Cooperativas &amp; Exportadores</text>
  <text x="1047" y="88" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.5" fill="#5A6268" text-anchor="middle">Acopio Tauri/Web y Polígono EUDR</text>

  <rect x="952" y="105" width="190" height="44" rx="5" fill="#FFFFFF" stroke="#C88A2C" stroke-width="1.1"/>
  <text x="1047" y="123" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#3E2712" text-anchor="middle">Catadores Q-Graders &amp; País</text>
  <text x="1047" y="139" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.5" fill="#5A6268" text-anchor="middle">Puntaje SCA + CONATRADEC</text>

  <rect x="952" y="156" width="190" height="46" rx="5" fill="#FDF5E6" stroke="#C88A2C" stroke-width="1.4"/>
  <text x="1047" y="174" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#3E2712" text-anchor="middle">Pasaporte QR en Empaque</text>
  <text x="1047" y="191" font-family="Liberation Sans, Noto Sans, sans-serif" font-size="9.5" font-weight="bold" fill="#1E5631" text-anchor="middle">Tostadores Globales (19+ Países)</text>
</svg>
